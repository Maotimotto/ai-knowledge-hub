<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Observability Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f1117; color: #e0e0e0; }
        .header { background: linear-gradient(135deg, #1a1a2e, #16213e); padding: 16px 24px;
                   display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a2a4a; }
        .header h1 { font-size: 1.4rem; color: #7c83ff; }
        .status { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #00e676; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; padding: 16px 24px; }
        .kpi-card { background: #1a1d2e; border-radius: 12px; padding: 18px; border: 1px solid #2a2d4a; }
        .kpi-card .label { font-size: 0.75rem; color: #888; text-transform: uppercase; letter-spacing: 0.05em; }
        .kpi-card .value { font-size: 2rem; font-weight: 700; margin: 4px 0; }
        .kpi-card .delta { font-size: 0.8rem; }
        .delta.up { color: #00e676; } .delta.down { color: #ff5252; }
        .charts-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; padding: 0 24px 16px; }
        .chart-card { background: #1a1d2e; border-radius: 12px; padding: 18px; border: 1px solid #2a2d4a; }
        .chart-card h3 { font-size: 0.9rem; color: #aaa; margin-bottom: 12px; }
        .bottom-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 0 24px 24px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th { text-align: left; padding: 8px 12px; border-bottom: 1px solid #2a2d4a; color: #888; font-weight: 600; }
        td { padding: 8px 12px; border-bottom: 1px solid #1e2030; }
        .badge { padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
        .badge-ok { background: #1b3a2a; color: #00e676; }
        .badge-warn { background: #3a351b; color: #ffd740; }
        .badge-err { background: #3a1b1b; color: #ff5252; }
        canvas { max-height: 260px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🔭 AI Observability Dashboard</h1>
        <div class="status"><div class="status-dot" id="wsStatus"></div><span id="wsLabel">Connecting...</span></div>
    </div>

    <div class="kpi-row">
        <div class="kpi-card"><div class="label">Requests / min</div><div class="value" id="kpiRpm">--</div><div class="delta up" id="kpiRpmDelta"></div></div>
        <div class="kpi-card"><div class="label">Avg Latency</div><div class="value" id="kpiLatency">--</div><div class="delta" id="kpiLatDelta"></div></div>
        <div class="kpi-card"><div class="label">Tokens (1h)</div><div class="value" id="kpiTokens">--</div><div class="delta" id="kpiTokDelta"></div></div>
        <div class="kpi-card"><div class="label">Error Rate</div><div class="value" id="kpiErrors">--</div><div class="delta down" id="kpiErrDelta"></div></div>
    </div>

    <div class="charts-grid">
        <div class="chart-card"><h3>📈 Request Rate (last 30 min)</h3><canvas id="requestChart"></canvas></div>
        <div class="chart-card"><h3>⏱ Latency Distribution</h3><canvas id="latencyChart"></canvas></div>
    </div>

    <div class="bottom-row">
        <div class="chart-card"><h3>🔤 Token Usage by Model</h3><canvas id="tokenChart"></canvas></div>
        <div class="chart-card">
            <h3>💰 Cost Breakdown (Today)</h3>
            <table>
                <thead><tr><th>Model</th><th>Requests</th><th>Tokens</th><th>Cost</th><th>Status</th></tr></thead>
                <tbody id="costTable"></tbody>
            </table>
        </div>
    </div>

<script>
const WS_URL = `ws://${location.host}/ws/metrics`;
const MAX_POINTS = 60;
let requestLabels = [], requestData = [], latencyBuckets = [0,0,0,0,0];
let tokenData = { labels: [], values: [] };

// --- Charts ---
const reqCtx = document.getElementById('requestChart').getContext('2d');
const requestChart = new Chart(reqCtx, {
    type: 'line',
    data: { labels: requestLabels, datasets: [{ label: 'RPM', data: requestData,
        borderColor: '#7c83ff', backgroundColor: 'rgba(124,131,255,0.1)', fill: true, tension: 0.4, pointRadius: 2 }] },
    options: { responsive: true, plugins: { legend: { display: false } },
        scales: { x: { ticks: { color: '#666' }, grid: { color: '#1e2030' } },
                  y: { ticks: { color: '#666' }, grid: { color: '#1e2030' }, beginAtZero: true } } }
});

const latCtx = document.getElementById('latencyChart').getContext('2d');
const latencyChart = new Chart(latCtx, {
    type: 'bar',
    data: { labels: ['<100ms','100-300ms','300-1s','1-3s','>3s'],
        datasets: [{ label: 'Requests', data: latencyBuckets,
            backgroundColor: ['#00e676','#69f0ae','#ffd740','#ff9800','#ff5252'] }] },
    options: { responsive: true, plugins: { legend: { display: false } },
        scales: { x: { ticks: { color: '#666' }, grid: { color: '#1e2030' } },
                  y: { ticks: { color: '#666' }, grid: { color: '#1e2030' }, beginAtZero: true } } }
});

const tokCtx = document.getElementById('tokenChart').getContext('2d');
const tokenChart = new Chart(tokCtx, {
    type: 'doughnut',
    data: { labels: tokenData.labels, datasets: [{ data: tokenData.values,
        backgroundColor: ['#7c83ff','#ff6b9d','#c084fc','#67e8f9','#fbbf24','#34d399'] }] },
    options: { responsive: true, plugins: { legend: { position: 'right', labels: { color: '#aaa' } } } }
});

// --- KPI updater ---
function updateKPIs(msg) {
    document.getElementById('kpiRpm').textContent = msg.rpm ?? '--';
    document.getElementById('kpiLatency').textContent = msg.avg_latency_ms ? msg.avg_latency_ms + 'ms' : '--';
    document.getElementById('kpiTokens').textContent = msg.total_tokens ? (msg.total_tokens/1000).toFixed(1)+'k' : '--';
    document.getElementById('kpiErrors').textContent = msg.error_rate != null ? msg.error_rate.toFixed(1)+'%' : '--';
}

function pushRequestPoint(label, value) {
    requestLabels.push(label); requestData.push(value);
    if (requestLabels.length > MAX_POINTS) { requestLabels.shift(); requestData.shift(); }
    requestChart.update('none');
}

function updateLatency(ms) {
    if (ms < 100) latencyBuckets[0]++;
    else if (ms < 300) latencyBuckets[1]++;
    else if (ms < 1000) latencyBuckets[2]++;
    else if (ms < 3000) latencyBuckets[3]++;
    else latencyBuckets[4]++;
    latencyChart.update('none');
}

function updateTokenChart(models) {
    tokenData.labels = models.map(m => m.name);
    tokenData.values = models.map(m => m.tokens);
    tokenChart.update();
}

function updateCostTable(rows) {
    const tbody = document.getElementById('costTable');
    tbody.innerHTML = rows.map(r => `<tr>
        <td>${r.model}</td><td>${r.requests}</td><td>${(r.tokens/1000).toFixed(1)}k</td>
        <td>$${r.cost.toFixed(2)}</td>
        <td><span class="badge ${r.error_rate < 1 ? 'badge-ok' : r.error_rate < 5 ? 'badge-warn' : 'badge-err'}">
            ${r.error_rate < 1 ? 'Healthy' : r.error_rate < 5 ? 'Warning' : 'Critical'}</span></td>
    </tr>`).join('');
}

// --- WebSocket ---
function connectWS() {
    const ws = new WebSocket(WS_URL);
    ws.onopen = () => { document.getElementById('wsLabel').textContent = 'Live'; document.getElementById('wsStatus').style.background = '#00e676'; };
    ws.onclose = () => { document.getElementById('wsLabel').textContent = 'Disconnected'; document.getElementById('wsStatus').style.background = '#ff5252'; setTimeout(connectWS, 3000); };
    ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        if (msg.type === 'kpi') updateKPIs(msg);
        if (msg.type === 'request_point') pushRequestPoint(msg.time, msg.rpm);
        if (msg.type === 'latency') updateLatency(msg.ms);
        if (msg.type === 'token_usage') updateTokenChart(msg.models);
        if (msg.type === 'cost_breakdown') updateCostTable(msg.rows);
    };
}
connectWS();

// --- Demo data (simulates WebSocket for standalone preview) ---
if (location.protocol === 'file:') {
    document.getElementById('wsLabel').textContent = 'Demo Mode';
    const demoModels = [
        { name: 'GPT-4o', requests: 1240, tokens: 850000, cost: 12.75, error_rate: 0.3 },
        { name: 'Claude 3.5', requests: 890, tokens: 620000, cost: 9.30, error_rate: 0.8 },
        { name: 'Llama 3.1', requests: 2100, tokens: 1400000, cost: 4.20, error_rate: 1.2 },
        { name: 'Gemini Pro', requests: 430, tokens: 310000, cost: 1.86, error_rate: 0.1 },
    ];
    updateKPIs({ rpm: 847, avg_latency_ms: 245, total_tokens: 3180000, error_rate: 0.6 });
    updateCostTable(demoModels);
    updateTokenChart(demoModels.map(m => ({ name: m.name, tokens: m.tokens })));
    const now = new Date();
    for (let i = 29; i >= 0; i--) {
        const t = new Date(now - i * 60000);
        pushRequestPoint(t.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}), Math.floor(700 + Math.random()*300));
        updateLatency(Math.floor(Math.random() * 800 + 50));
    }
}
</script>
</body>
</html>
