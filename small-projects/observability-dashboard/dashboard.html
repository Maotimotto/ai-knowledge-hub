<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Observability Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
            background: #ffffff; color: #1a1a1a; font-size: 16px; line-height: 1.6;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 32px 40px; }

        .header {
            display: flex; justify-content: space-between; align-items: baseline;
            margin-bottom: 32px; padding-bottom: 16px; border-bottom: 1px solid rgba(0,0,0,0.1);
        }
        .header h1 { font-size: 44px; font-weight: 700; letter-spacing: -0.02em; color: #1a1a1a; }
        .header .status {
            display: flex; align-items: center; gap: 8px; font-size: 14px; color: #6b7280;
        }
        .status-dot {
            width: 8px; height: 8px; border-radius: 50%; background: #22c55e;
        }
        .status-dot.disconnected { background: #ef4444; }

        .kpi-row {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;
            margin-bottom: 32px;
        }
        .kpi-card {
            border: 1px solid rgba(0,0,0,0.1); border-radius: 8px; padding: 20px;
        }
        .kpi-card .label {
            font-size: 13px; color: #6b7280; text-transform: uppercase;
            letter-spacing: 0.05em; margin-bottom: 4px;
        }
        .kpi-card .value { font-size: 32px; font-weight: 700; color: #1a1a1a; }
        .kpi-card .delta { font-size: 13px; margin-top: 4px; }
        .delta.up { color: #22c55e; }
        .delta.down { color: #ef4444; }

        .charts-grid {
            display: grid; grid-template-columns: 2fr 1fr; gap: 16px;
            margin-bottom: 32px;
        }
        .chart-card {
            border: 1px solid rgba(0,0,0,0.1); border-radius: 8px; padding: 20px;
        }
        .chart-card h3 {
            font-size: 14px; color: #6b7280; font-weight: 600;
            margin-bottom: 16px; text-transform: uppercase; letter-spacing: 0.03em;
        }
        canvas { max-height: 280px; }

        .bottom-row {
            display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
        }

        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th {
            text-align: left; padding: 10px 12px;
            border-bottom: 1px solid rgba(0,0,0,0.1); color: #6b7280;
            font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em;
        }
        td { padding: 10px 12px; border-bottom: 1px solid rgba(0,0,0,0.05); color: #1a1a1a; }
        .badge {
            display: inline-block; padding: 2px 8px; border-radius: 4px;
            font-size: 12px; font-weight: 600;
        }
        .badge-ok { background: #f0fdf4; color: #16a34a; }
        .badge-warn { background: #fffbeb; color: #d97706; }
        .badge-err { background: #fef2f2; color: #dc2626; }

        @media (max-width: 900px) {
            .kpi-row { grid-template-columns: repeat(2, 1fr); }
            .charts-grid, .bottom-row { grid-template-columns: 1fr; }
            .header h1 { font-size: 28px; }
            .container { padding: 20px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Observability Dashboard</h1>
        <div class="status">
            <div class="status-dot" id="wsStatus"></div>
            <span id="wsLabel">Connecting...</span>
        </div>
    </div>

    <div class="kpi-row">
        <div class="kpi-card">
            <div class="label">Requests / min</div>
            <div class="value" id="kpiRpm">--</div>
            <div class="delta up" id="kpiRpmDelta"></div>
        </div>
        <div class="kpi-card">
            <div class="label">Avg Latency</div>
            <div class="value" id="kpiLatency">--</div>
            <div class="delta" id="kpiLatDelta"></div>
        </div>
        <div class="kpi-card">
            <div class="label">Tokens (1h)</div>
            <div class="value" id="kpiTokens">--</div>
            <div class="delta" id="kpiTokDelta"></div>
        </div>
        <div class="kpi-card">
            <div class="label">Error Rate</div>
            <div class="value" id="kpiErrors">--</div>
            <div class="delta down" id="kpiErrDelta"></div>
        </div>
    </div>

    <div class="charts-grid">
        <div class="chart-card">
            <h3>Request Rate (last 30 min)</h3>
            <canvas id="requestChart"></canvas>
        </div>
        <div class="chart-card">
            <h3>Latency Distribution</h3>
            <canvas id="latencyChart"></canvas>
        </div>
    </div>

    <div class="bottom-row">
        <div class="chart-card">
            <h3>Token Usage by Model</h3>
            <canvas id="tokenChart"></canvas>
        </div>
        <div class="chart-card">
            <h3>Cost Breakdown (Today)</h3>
            <table>
                <thead>
                    <tr><th>Model</th><th>Requests</th><th>Tokens</th><th>Cost</th><th>Status</th></tr>
                </thead>
                <tbody id="costTable"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
const WS_URL = `ws://${location.host}/ws/metrics`;
const MAX_POINTS = 60;
let requestLabels = [], requestData = [], latencyBuckets = [0,0,0,0,0];
let tokenData = { labels: [], values: [] };

const chartColors = {
    blue: '#0075de',
    blueLight: 'rgba(0,117,222,0.08)',
    green: '#22c55e',
    yellow: '#eab308',
    orange: '#f59e0b',
    red: '#ef4444',
    grid: 'rgba(0,0,0,0.06)',
    tick: '#9ca3af',
    palette: ['#0075de','#22c55e','#f59e0b','#ef4444','#8b5cf6','#06b6d4']
};

const reqCtx = document.getElementById('requestChart').getContext('2d');
const requestChart = new Chart(reqCtx, {
    type: 'line',
    data: { labels: requestLabels, datasets: [{
        label: 'RPM', data: requestData,
        borderColor: chartColors.blue, backgroundColor: chartColors.blueLight,
        fill: true, tension: 0.3, pointRadius: 2, borderWidth: 2
    }]},
    options: { responsive: true, plugins: { legend: { display: false } },
        scales: {
            x: { ticks: { color: chartColors.tick, font: { size: 11 } }, grid: { color: chartColors.grid } },
            y: { ticks: { color: chartColors.tick, font: { size: 11 } }, grid: { color: chartColors.grid }, beginAtZero: true }
        }
    }
});

const latCtx = document.getElementById('latencyChart').getContext('2d');
const latencyChart = new Chart(latCtx, {
    type: 'bar',
    data: { labels: ['<100ms','100-300ms','300ms-1s','1-3s','>3s'],
        datasets: [{ label: 'Requests', data: latencyBuckets,
            backgroundColor: [chartColors.green, '#86efac', chartColors.yellow, chartColors.orange, chartColors.red],
            borderRadius: 4, borderSkipped: false }]},
    options: { responsive: true, plugins: { legend: { display: false } },
        scales: {
            x: { ticks: { color: chartColors.tick, font: { size: 11 } }, grid: { display: false } },
            y: { ticks: { color: chartColors.tick, font: { size: 11 } }, grid: { color: chartColors.grid }, beginAtZero: true }
        }
    }
});

const tokCtx = document.getElementById('tokenChart').getContext('2d');
const tokenChart = new Chart(tokCtx, {
    type: 'doughnut',
    data: { labels: tokenData.labels, datasets: [{
        data: tokenData.values, backgroundColor: chartColors.palette, borderWidth: 0
    }]},
    options: { responsive: true, cutout: '60%',
        plugins: { legend: { position: 'right', labels: { color: '#374151', font: { size: 12 }, padding: 12 } } } }
});

function updateKPIs(msg) {
    document.getElementById('kpiRpm').textContent = msg.rpm ?? '--';
    document.getElementById('kpiLatency').textContent = msg.avg_latency_ms ? msg.avg_latency_ms + 'ms' : '--';
    document.getElementById('kpiTokens').textContent = msg.total_tokens ? (msg.total_tokens/1000).toFixed(1)+'k' : '--';
    document.getElementById('kpiErrors').textContent = msg.error_rate != null ? msg.error_rate.toFixed(1)+'%' : '--';
}

function pushRequestPoint(label, value) {
    requestLabels.push(label); requestData.push(value);
    if (requestLabels.length > MAX_POINTS) { requestLabels.shift(); requestData.shift(); }
    requestChart.update('none');
}

function updateLatency(ms) {
    if (ms < 100) latencyBuckets[0]++;
    else if (ms < 300) latencyBuckets[1]++;
    else if (ms < 1000) latencyBuckets[2]++;
    else if (ms < 3000) latencyBuckets[3]++;
    else latencyBuckets[4]++;
    latencyChart.update('none');
}

function updateTokenChart(models) {
    tokenData.labels = models.map(m => m.name);
    tokenData.values = models.map(m => m.tokens);
    tokenChart.update();
}

function updateCostTable(rows) {
    const tbody = document.getElementById('costTable');
    tbody.innerHTML = rows.map(r => `<tr>
        <td>${r.model}</td><td>${r.requests}</td><td>${(r.tokens/1000).toFixed(1)}k</td>
        <td>$${r.cost.toFixed(2)}</td>
        <td><span class="badge ${r.error_rate < 1 ? 'badge-ok' : r.error_rate < 5 ? 'badge-warn' : 'badge-err'}">
            ${r.error_rate < 1 ? 'Healthy' : r.error_rate < 5 ? 'Warning' : 'Critical'}</span></td>
    </tr>`).join('');
}

function connectWS() {
    const ws = new WebSocket(WS_URL);
    ws.onopen = () => {
        document.getElementById('wsLabel').textContent = 'Live';
        document.getElementById('wsStatus').className = 'status-dot';
    };
    ws.onclose = () => {
        document.getElementById('wsLabel').textContent = 'Disconnected';
        document.getElementById('wsStatus').className = 'status-dot disconnected';
        setTimeout(connectWS, 3000);
    };
    ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        if (msg.type === 'kpi') updateKPIs(msg);
        if (msg.type === 'request_point') pushRequestPoint(msg.time, msg.rpm);
        if (msg.type === 'latency') updateLatency(msg.ms);
        if (msg.type === 'token_usage') updateTokenChart(msg.models);
        if (msg.type === 'cost_breakdown') updateCostTable(msg.rows);
    };
}
connectWS();

// Demo data for standalone preview
if (location.protocol === 'file:') {
    document.getElementById('wsLabel').textContent = 'Demo Mode';
    const demoModels = [
        { name: 'GPT-4o', requests: 1240, tokens: 850000, cost: 12.75, error_rate: 0.3 },
        { name: 'Claude 3.5', requests: 890, tokens: 620000, cost: 9.30, error_rate: 0.8 },
        { name: 'Llama 3.1', requests: 2100, tokens: 1400000, cost: 4.20, error_rate: 1.2 },
        { name: 'Gemini Pro', requests: 430, tokens: 310000, cost: 1.86, error_rate: 0.1 },
    ];
    updateKPIs({ rpm: 847, avg_latency_ms: 245, total_tokens: 3180000, error_rate: 0.6 });
    updateCostTable(demoModels);
    updateTokenChart(demoModels.map(m => ({ name: m.name, tokens: m.tokens })));
    const now = new Date();
    for (let i = 29; i >= 0; i--) {
        const t = new Date(now - i * 60000);
        pushRequestPoint(t.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}), Math.floor(700 + Math.random()*300));
        updateLatency(Math.floor(Math.random() * 800 + 50));
    }
}
</script>
</body>
</html>
