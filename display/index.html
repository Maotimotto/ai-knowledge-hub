<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 知识吸收仪表盘</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0f;--bg2:#12121a;--bg3:#1a1a2e;--bg4:#232340;
  --fg:#e2e8f0;--fg2:#94a3b8;--fg3:#64748b;
  --accent:#6366f1;--accent2:#818cf8;--accent3:#4f46e5;
  --green:#22c55e;--yellow:#eab308;--red:#ef4444;--cyan:#06b6d4;
  --radius:12px;--radius-sm:8px;
  --shadow:0 4px 24px rgba(0,0,0,.4);
  --transition:all .3s cubic-bezier(.4,0,.2,1);
}
html{scroll-behavior:smooth}
body{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--fg);line-height:1.6;min-height:100vh;overflow-x:hidden}
/* Scrollbar */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--accent)}

/* === NAV === */
.nav{position:sticky;top:0;z-index:100;background:rgba(10,10,15,.85);backdrop-filter:blur(20px);border-bottom:1px solid rgba(99,102,241,.15);padding:0 24px}
.nav-inner{max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:16px;height:56px}
.nav-logo{font-size:18px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap}
.nav-tabs{display:flex;gap:4px;margin-left:24px;overflow-x:auto;flex:1}
.nav-tab{padding:8px 16px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;color:var(--fg2);transition:var(--transition);white-space:nowrap;border:none;background:none;font-family:inherit}
.nav-tab:hover{color:var(--fg);background:rgba(99,102,241,.1)}
.nav-tab.active{color:#fff;background:var(--accent)}

/* === LAYOUT === */
.container{max-width:1400px;margin:0 auto;padding:24px}
.section{display:none;animation:fadeIn .4s ease}
.section.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.section-title{font-size:28px;font-weight:700;margin-bottom:8px;background:linear-gradient(135deg,var(--fg),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.section-desc{color:var(--fg2);margin-bottom:32px;font-size:15px}

/* === KNOWLEDGE GRAPH === */
.graph-container{position:relative;background:var(--bg2);border-radius:var(--radius);border:1px solid rgba(99,102,241,.12);overflow:hidden;min-height:600px}
.graph-container svg{width:100%;height:600px}
.graph-node{cursor:pointer;transition:var(--transition)}
.graph-node:hover .node-circle{filter:drop-shadow(0 0 12px var(--accent))}
.node-circle{transition:var(--transition)}
.node-label{font-size:11px;fill:var(--fg);text-anchor:middle;pointer-events:none;font-family:inherit}
.graph-edge{stroke:rgba(99,102,241,.2);stroke-width:1.5;fill:none}
.graph-tooltip{position:absolute;background:var(--bg3);border:1px solid var(--accent);border-radius:var(--radius-sm);padding:12px 16px;font-size:13px;pointer-events:none;opacity:0;transition:opacity .2s;z-index:10;max-width:260px;box-shadow:var(--shadow)}
.graph-tooltip.show{opacity:1}

/* === CONCEPT CARDS === */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.card{perspective:800px;height:220px;cursor:pointer}
.card-inner{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
.card:hover .card-inner{transform:rotateY(180deg)}
.card-front,.card-back{position:absolute;inset:0;border-radius:var(--radius);backface-visibility:hidden;padding:24px;display:flex;flex-direction:column}
.card-front{background:linear-gradient(135deg,var(--bg3),var(--bg2));border:1px solid rgba(99,102,241,.15)}
.card-back{background:linear-gradient(135deg,var(--accent3),var(--accent));transform:rotateY(180deg);color:#fff}
.card-num{font-size:12px;color:var(--accent);font-weight:600;margin-bottom:8px;letter-spacing:1px}
.card-name{font-size:18px;font-weight:700;margin-bottom:12px}
.card-diff{display:inline-flex;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;width:fit-content}
.diff-easy{background:rgba(34,197,94,.15);color:var(--green)}
.diff-medium{background:rgba(234,179,8,.15);color:var(--yellow)}
.diff-hard{background:rgba(239,68,68,.15);color:var(--red)}
.card-topics{color:var(--fg2);font-size:12px;margin-top:auto;line-height:1.8}
.card-back-title{font-size:15px;font-weight:700;margin-bottom:12px;opacity:.9}
.card-back ul{list-style:none;font-size:13px;line-height:2}
.card-back li::before{content:"→ ";opacity:.7}

/* === QUICK REF === */
.ref-tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.ref-tab{padding:6px 14px;border-radius:20px;font-size:13px;cursor:pointer;background:var(--bg3);color:var(--fg2);border:1px solid transparent;transition:var(--transition);font-family:inherit}
.ref-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.ref-content{display:none}
.ref-content.active{display:block}
.ref-table{width:100%;border-collapse:collapse;background:var(--bg2);border-radius:var(--radius);overflow:hidden;border:1px solid rgba(99,102,241,.1)}
.ref-table th{background:var(--bg3);padding:12px 16px;text-align:left;font-size:13px;color:var(--accent2);font-weight:600;border-bottom:1px solid rgba(99,102,241,.1)}
.ref-table td{padding:10px 16px;font-size:13px;border-bottom:1px solid rgba(255,255,255,.03);color:var(--fg2)}
.ref-table tr:hover td{background:rgba(99,102,241,.04)}
.ref-table code{background:var(--bg4);padding:2px 6px;border-radius:4px;font-size:12px;color:var(--cyan)}

/* === LEARNING PATHS === */
.path-selector{display:flex;gap:12px;margin-bottom:32px;flex-wrap:wrap}
.path-btn{padding:12px 24px;border-radius:var(--radius);cursor:pointer;background:var(--bg3);color:var(--fg2);border:2px solid transparent;transition:var(--transition);font-family:inherit;font-size:14px;font-weight:600}
.path-btn.active{border-color:var(--accent);color:#fff;background:rgba(99,102,241,.1)}
.path-btn:hover{border-color:rgba(99,102,241,.4)}
.path-flow{display:none}
.path-flow.active{display:block}
.path-steps{position:relative;padding-left:40px}
.path-step{position:relative;padding:16px 0 32px 24px;border-left:2px solid var(--bg4)}
.path-step:last-child{border-left-color:transparent}
.path-step::before{content:'';position:absolute;left:-7px;top:20px;width:12px;height:12px;border-radius:50%;background:var(--bg4);border:2px solid var(--accent);transition:var(--transition)}
.path-step.done::before{background:var(--accent)}
.path-step-title{font-size:16px;font-weight:700;margin-bottom:4px}
.path-step-desc{font-size:13px;color:var(--fg2)}
.path-step-tags{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.path-tag{padding:2px 10px;border-radius:12px;font-size:11px;background:rgba(99,102,241,.12);color:var(--accent2)}

/* === PROGRESS === */
.progress-bar-wrap{background:var(--bg3);border-radius:20px;height:12px;overflow:hidden;margin-bottom:8px}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--cyan));border-radius:20px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.progress-stats{display:flex;gap:32px;margin-bottom:32px;flex-wrap:wrap}
.stat{background:var(--bg2);border:1px solid rgba(99,102,241,.1);border-radius:var(--radius);padding:20px 24px;min-width:160px}
.stat-val{font-size:32px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stat-label{font-size:13px;color:var(--fg2);margin-top:4px}
.progress-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.prog-item{display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--bg2);border:1px solid rgba(99,102,241,.08);border-radius:var(--radius-sm);transition:var(--transition)}
.prog-item:hover{border-color:rgba(99,102,241,.25)}
.prog-check{width:20px;height:20px;border-radius:6px;border:2px solid var(--fg3);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:var(--transition);flex-shrink:0}
.prog-check.checked{background:var(--accent);border-color:var(--accent)}
.prog-check.checked::after{content:'✓';color:#fff;font-size:12px;font-weight:700}
.prog-name{font-size:14px;font-weight:600}
.prog-cat{font-size:11px;color:var(--fg3)}

/* Responsive */
@media(max-width:768px){
  .nav-inner{gap:8px}
  .nav-logo{font-size:15px}
  .nav-tab{padding:6px 10px;font-size:12px}
  .container{padding:16px}
  .cards-grid{grid-template-columns:1fr}
  .progress-list{grid-template-columns:1fr}
}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <div class="nav-logo">🧠 AI 知识仪表盘</div>

<!-- QUICK REF -->
<section class="section" id="sec-ref">

<!-- LEARNING PATHS -->
<section class="section" id="sec-paths">

<!-- PROGRESS -->
<section class="section" id="sec-progress">

  <div class="progress-stats" id="progStats"></div>

</section>

</div>

// ===== KNOWLEDGE GRAPH =====
(function(){
  const svg = document.getElementById('graphSvg');
  const tooltip = document.getElementById('tooltip');
  const W = 1400, H = 600;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

  // Position nodes in a force-like layout (precomputed)
  const positions = {};
  const cx = W/2, cy = H/2;
  const layers = [
    {ids:['ml','database','docker'],y:80},
    {ids:['dl','nlp'],y:170},
    {ids:['cv','transformer','vectordb'],y:270},
    {ids:['llm-stack','rag','interview'],y:370},
    {ids:['finetune','agent','inference','observability','multimodal','rag-adv'],y:460},
    {ids:['langgraph','safety','serving','project'],y:550},
    {ids:['startup','finance'],y:560},
  ];
  layers.forEach(layer => {
    const n = layer.ids.length;
    layer.ids.forEach((id, i) => {
      const d = DOMAINS.find(d => d.id === id);
      positions[id] = {x: (W/(n+1))*(i+1), y: layer.y, data: d};
    });
  });

  // Add some horizontal jitter
  const jitter = {rag:-40,agent:50,finetune:-60,inference:30,multimodal:-20,'rag-adv':60,safety:-30,serving:40,project:-10,startup:-50,finance:50};
  Object.keys(jitter).forEach(k => { if(positions[k]) positions[k].x += jitter[k]; });

  // Draw edges
  EDGES.forEach(([from, to]) => {
    if(!positions[from] || !positions[to]) return;
    const line = document.createElementNS('http://www.w3.org/2000/svg','path');
    const x1=positions[from].x, y1=positions[from].y, x2=positions[to].x, y2=positions[to].y;
    const mx = (x1+x2)/2, my = (y1+y2)/2 - 30;
    line.setAttribute('d', `M${x1},${y1} Q${mx},${my} ${x2},${y2}`);
    line.setAttribute('class','graph-edge');
    svg.appendChild(line);
  });

  // Draw nodes
  DOMAINS.forEach(d => {
    const p = positions[d.id];
    if(!p) return;
    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('class','graph-node');
    g.setAttribute('transform',`translate(${p.x},${p.y})`);

    const circle = document.createElementNS('http://www.w3.org/2000/svg','circle');
    circle.setAttribute('r', d.num === '+' ? 20 : 26);
    circle.setAttribute('class','node-circle');
    circle.setAttribute('fill', d.color + '22');
    circle.setAttribute('stroke', d.color);
    circle.setAttribute('stroke-width','2');
    g.appendChild(circle);

    const text = document.createElementNS('http://www.w3.org/2000/svg','text');
    text.setAttribute('class','node-label');
    text.setAttribute('dy','4');
    text.textContent = d.name.length > 5 ? d.name.slice(0,5)+'…' : d.name;
    g.appendChild(text);

    g.addEventListener('mouseenter', e => {
      tooltip.innerHTML = `<strong>${d.name}</strong><br><span style="color:${d.color}">${d.diff}</span> · ${d.cat}<br><br>${d.desc}`;
      tooltip.classList.add('show');
    });
    g.addEventListener('mousemove', e => {
      const rect = document.getElementById('graphBox').getBoundingClientRect();
      tooltip.style.left = (e.clientX - rect.left + 16) + 'px';
      tooltip.style.top = (e.clientY - rect.top - 10) + 'px';
    });
    g.addEventListener('mouseleave', () => tooltip.classList.remove('show'));

    svg.appendChild(g);
  });
})();

// ===== PROGRESS TRACKER =====
(function(){
  const KEY = 'ai-kb-progress';
  const saved = JSON.parse(localStorage.getItem(KEY) || '{}');
  const stats = document.getElementById('progStats');
  const list = document.getElementById('progList');

  function render(){
    const total = DOMAINS.length;
    const done = DOMAINS.filter(d => saved[d.id]).length;
    const pct = Math.round(done/total*100);
    stats.innerHTML = `
      <div><div class="stat"><div class="stat-val">${done}/${total}</div><div class="stat-label">已完成</div></div></div>
      <div><div class="stat"><div class="stat-val">${pct}%</div><div class="stat-label">完成率</div></div></div>
      <div style="flex:1"><div class="stat"><div class="progress-bar-wrap"><div class="progress-bar" style="width:${pct}%"></div></div><div class="stat-label">总体进度</div></div></div>`;

    list.innerHTML = '';
    DOMAINS.forEach(d => {
      list.innerHTML += `
        <div class="prog-item">
          <div class="prog-check ${saved[d.id]?'checked':''}" data-id="${d.id}"></div>
          <div><div class="prog-name">${d.name}</div><div class="prog-cat">${d.cat} · ${d.diff === 'easy' ? '入门' : d.diff === 'medium' ? '进阶' : '高级'}</div></div>
        </div>`;
    });

    list.querySelectorAll('.prog-check').forEach(el => {
      el.addEventListener('click', () => {
        const id = el.dataset.id;
        if(saved[id]) delete saved[id]; else saved[id] = true;
        localStorage.setItem(KEY, JSON.stringify(saved));
        render();
      });
    });
  }
  render();
})();
