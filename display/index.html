<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 知识吸收仪表盘</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--bg2:#f6f5f4;--bg3:#ffffff;--bg4:#f6f5f4;
  --fg:rgba(0,0,0,.95);--fg2:rgba(0,0,0,.5);--fg3:rgba(0,0,0,.35);
  --accent:#0075de;--accent-light:rgba(0,117,222,.08);--accent-border:rgba(0,117,222,.2);
  --green:#2d9d4e;--yellow:#c2900a;--red:#d44;--cyan:#0989a6;
  --radius:8px;--radius-sm:6px;
  --border:1px solid rgba(0,0,0,.1);
  --shadow:0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 2px 8px rgba(0,0,0,.04),0 1px 2px rgba(0,0,0,.04);
  --transition:all .2s ease;
}
html{scroll-behavior:smooth}
body{font-family:'Inter','Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif;background:var(--bg);color:var(--fg);line-height:1.6;font-size:16px;min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,.15);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(0,0,0,.25)}

/* === NAV === */
.nav{position:sticky;top:0;z-index:100;background:#fff;border-bottom:var(--border);padding:0 32px}
.nav-inner{max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:16px;height:52px}
.nav-logo{font-size:16px;font-weight:700;color:var(--fg);white-space:nowrap;letter-spacing:-.3px}
.nav-logo-mark{color:var(--accent);font-weight:800}
.nav-tabs{display:flex;gap:2px;margin-left:24px;overflow-x:auto;flex:1}
.nav-tab{padding:6px 14px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;font-weight:500;color:var(--fg2);transition:var(--transition);white-space:nowrap;border:none;background:none;font-family:inherit}
.nav-tab:hover{color:var(--fg);background:rgba(0,0,0,.04)}
.nav-tab.active{color:var(--accent);background:var(--accent-light)}

/* === LAYOUT === */
.container{max-width:1400px;margin:0 auto;padding:32px}
.section{display:none;animation:fadeIn .3s ease}
.section.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.section-title{font-size:44px;font-weight:800;margin-bottom:8px;color:var(--fg);letter-spacing:-.5px;line-height:1.2}
.section-desc{color:var(--fg2);margin-bottom:32px;font-size:16px;line-height:1.6}

/* === KNOWLEDGE GRAPH === */
.graph-container{position:relative;background:var(--bg2);border-radius:var(--radius);border:var(--border);overflow:hidden;min-height:600px}
.graph-container svg{width:100%;height:600px}
.graph-node{cursor:pointer;transition:var(--transition)}
.graph-node:hover .node-circle{filter:drop-shadow(0 0 8px rgba(0,117,222,.2))}
.node-circle{transition:var(--transition)}
.node-label{font-size:11px;fill:var(--fg);text-anchor:middle;pointer-events:none;font-family:'Inter','Noto Sans SC',system-ui,sans-serif;font-weight:600}
.graph-edge{stroke:rgba(0,0,0,.08);stroke-width:1.5;fill:none}
.graph-tooltip{position:absolute;background:#fff;border:var(--border);border-radius:var(--radius-sm);padding:12px 16px;font-size:13px;pointer-events:none;opacity:0;transition:opacity .15s;z-index:10;max-width:260px;box-shadow:var(--shadow-md)}
.graph-tooltip.show{opacity:1}

/* === CONCEPT CARDS === */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{perspective:800px;height:220px;cursor:pointer}
.card-inner{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
.card:hover .card-inner{transform:rotateY(180deg)}
.card-front,.card-back{position:absolute;inset:0;border-radius:var(--radius);backface-visibility:hidden;padding:24px;display:flex;flex-direction:column}
.card-front{background:#fff;border:var(--border);box-shadow:var(--shadow)}
.card-back{background:var(--accent);transform:rotateY(180deg);color:#fff;border-radius:var(--radius)}
.card-num{font-size:11px;color:var(--accent);font-weight:700;margin-bottom:8px;letter-spacing:1.5px;text-transform:uppercase}
.card-name{font-size:18px;font-weight:700;margin-bottom:12px;color:var(--fg)}
.card-diff{display:inline-flex;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;width:fit-content}
.diff-easy{background:rgba(45,157,78,.08);color:var(--green)}
.diff-medium{background:rgba(194,144,10,.08);color:var(--yellow)}
.diff-hard{background:rgba(221,68,68,.08);color:var(--red)}
.card-topics{color:var(--fg2);font-size:12px;margin-top:auto;line-height:1.8}
.card-back-title{font-size:15px;font-weight:700;margin-bottom:12px;opacity:.9}
.card-back ul{list-style:none;font-size:13px;line-height:2}
.card-back li::before{content:"— ";opacity:.7}

/* === QUICK REF === */
.ref-tabs{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap}
.ref-tab{padding:6px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;cursor:pointer;background:transparent;color:var(--fg2);border:var(--border);transition:var(--transition);font-family:inherit}
.ref-tab:hover{background:rgba(0,0,0,.03)}
.ref-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.ref-content{display:none}
.ref-content.active{display:block}
.ref-table{width:100%;border-collapse:collapse;background:#fff;border-radius:var(--radius);overflow:hidden;border:var(--border)}
.ref-table th{background:var(--bg2);padding:12px 16px;text-align:left;font-size:13px;color:var(--fg2);font-weight:600;border-bottom:var(--border);letter-spacing:.3px}
.ref-table td{padding:10px 16px;font-size:14px;border-bottom:1px solid rgba(0,0,0,.04);color:var(--fg)}
.ref-table tr:nth-child(even) td{background:var(--bg2)}
.ref-table tr:hover td{background:rgba(0,117,222,.04)}
.ref-table code{background:var(--bg2);padding:2px 6px;border-radius:4px;font-size:12px;color:var(--accent);font-family:'SF Mono','Fira Code',monospace}

/* === LEARNING PATHS === */
.path-selector{display:flex;gap:8px;margin-bottom:32px;flex-wrap:wrap}
.path-btn{padding:10px 20px;border-radius:var(--radius);cursor:pointer;background:#fff;color:var(--fg2);border:var(--border);transition:var(--transition);font-family:inherit;font-size:14px;font-weight:600}
.path-btn.active{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}
.path-btn:hover{border-color:rgba(0,0,0,.2)}
.path-flow{display:none}
.path-flow.active{display:block}
.path-steps{position:relative;padding-left:40px}
.path-step{position:relative;padding:16px 0 32px 24px;border-left:2px solid rgba(0,0,0,.08)}
.path-step:last-child{border-left-color:transparent}
.path-step::before{content:'';position:absolute;left:-7px;top:20px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid rgba(0,0,0,.15);transition:var(--transition)}
.path-step.done::before{background:var(--accent);border-color:var(--accent)}
.path-step-title{font-size:16px;font-weight:700;margin-bottom:4px}
.path-step-desc{font-size:14px;color:var(--fg2)}
.path-step-tags{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.path-tag{padding:2px 10px;border-radius:12px;font-size:11px;font-weight:500;background:var(--accent-light);color:var(--accent)}

/* === PROGRESS === */
.progress-bar-wrap{background:rgba(0,0,0,.06);border-radius:20px;height:8px;overflow:hidden;margin-bottom:8px}
.progress-bar{height:100%;background:var(--accent);border-radius:20px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.progress-stats{display:flex;gap:16px;margin-bottom:32px;flex-wrap:wrap}
.stat{background:#fff;border:var(--border);border-radius:var(--radius);padding:20px 24px;min-width:160px;box-shadow:var(--shadow)}
.stat-val{font-size:32px;font-weight:800;color:var(--fg);letter-spacing:-.5px}
.stat-label{font-size:13px;color:var(--fg2);margin-top:4px}
.progress-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:8px}
.prog-item{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#fff;border:var(--border);border-radius:var(--radius-sm);transition:var(--transition)}
.prog-item:hover{box-shadow:var(--shadow)}
.prog-check{width:18px;height:18px;border-radius:4px;border:1.5px solid rgba(0,0,0,.2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:var(--transition);flex-shrink:0}
.prog-check.checked{background:var(--accent);border-color:var(--accent)}
.prog-check.checked::after{content:'✓';color:#fff;font-size:11px;font-weight:700}
.prog-name{font-size:14px;font-weight:600}
.prog-cat{font-size:12px;color:var(--fg2)}

/* === ANALOGY CARDS === */
.analogy-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.analogy-card{background:#fff;border:var(--border);border-radius:var(--radius);overflow:hidden;transition:var(--transition)}
.analogy-card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.analogy-header{padding:16px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(0,0,0,.06)}
.analogy-icon{width:36px;height:36px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;background:var(--bg2)}
.analogy-concept{font-size:15px;font-weight:700}
.analogy-title{font-size:12px;color:var(--accent);font-weight:500}
.analogy-body{padding:16px 20px}
.analogy-text{font-size:14px;color:var(--fg2);line-height:1.7}
.analogy-diagram{background:var(--bg2);border-radius:var(--radius-sm);padding:12px;text-align:center;overflow-x:auto}
.analogy-diagram svg{max-width:100%;height:auto}

/* === COMPARISON TABLES === */
.comp-section{margin-bottom:40px}
.comp-title{font-size:18px;font-weight:700;margin-bottom:16px;color:var(--fg)}
.comp-table{width:100%;border-collapse:collapse;background:#fff;border-radius:var(--radius);overflow:hidden;border:var(--border)}
.comp-table th{background:var(--bg2);padding:10px 14px;text-align:left;font-size:12px;color:var(--fg2);font-weight:600;border-bottom:var(--border);white-space:nowrap;letter-spacing:.3px}
.comp-table td{padding:10px 14px;font-size:13px;border-bottom:1px solid rgba(0,0,0,.04);color:var(--fg);vertical-align:top}
.comp-table tr:nth-child(even) td{background:var(--bg2)}
.comp-table tr:hover td{background:rgba(0,117,222,.04)}
.comp-table .dim-label{color:var(--accent);font-weight:600;white-space:nowrap}

/* === RELATIONSHIP MAP === */
.rel-container{background:var(--bg2);border-radius:var(--radius);border:var(--border);overflow:hidden;position:relative}
.rel-container svg{width:100%;height:500px}
.rel-info{position:absolute;bottom:16px;left:16px;background:#fff;border:var(--border);border-radius:var(--radius-sm);padding:12px 16px;font-size:13px;max-width:320px;box-shadow:var(--shadow-md);display:none;line-height:1.7}
.rel-info.show{display:block}
.rel-legend{display:flex;gap:16px;margin-bottom:16px;flex-wrap:wrap;font-size:12px;color:var(--fg2)}
.rel-legend span{display:flex;align-items:center;gap:6px}
.rel-dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.rel-edge{stroke:rgba(0,0,0,.06);stroke-width:1.5;transition:var(--transition)}
.rel-edge.active{stroke:var(--accent);stroke-width:2}
.rel-node{cursor:pointer}

/* === ONE-LINE SUMMARIES === */
.oneline-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:8px}
.oneline-card{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;background:#fff;border:var(--border);border-radius:var(--radius-sm);transition:var(--transition);cursor:default}
.oneline-card:hover{box-shadow:var(--shadow)}
.compare-block{margin-bottom:32px}
.compare-title{font-size:18px;font-weight:700;margin-bottom:16px;color:var(--fg)}
.compare-scroll{overflow-x:auto}
.oneline-name{font-size:14px;font-weight:700;white-space:nowrap;flex-shrink:0;min-width:80px}
.oneline-text{font-size:14px;color:var(--fg2);line-height:1.5}

@media(max-width:768px){
  .nav-inner{gap:8px}
  .nav-logo{font-size:14px}
  .nav-tab{padding:6px 10px;font-size:12px}
  .container{padding:16px}
  .section-title{font-size:28px}
  .cards-grid{grid-template-columns:1fr}
  .progress-list{grid-template-columns:1fr}
  .analogy-grid{grid-template-columns:1fr}
  .oneline-grid{grid-template-columns:1fr}
  .comp-table{font-size:11px}
  .comp-table th,.comp-table td{padding:8px 10px}
  .rel-container svg{height:350px}
  .rel-info{max-width:260px;font-size:12px}
}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <div class="nav-logo"><span class="nav-logo-mark">//</span> AI 知识仪表盘</div>
    <div class="nav-tabs">

</nav>

<div class="container">

<!-- KNOWLEDGE GRAPH -->
<section class="section active" id="sec-graph">
  <h2 class="section-title">知识图谱</h2>
  <p class="section-desc">点击节点查看详情，拖拽可平移视图。线条表示知识依赖关系。</p>
  <div class="graph-container" id="graphBox">
    <svg id="graphSvg"></svg>
    <div class="graph-tooltip" id="tooltip"></div>
  </div>
</section>

<!-- CONCEPT CARDS -->
<section class="section" id="sec-cards">
  <h2 class="section-title">概念卡片</h2>
  <p class="section-desc">悬停翻转卡片，查看每个领域的核心知识点速览。</p>
  <div class="cards-grid" id="cardsGrid"></div>
</section>

<!-- QUICK REF -->
<section class="section" id="sec-ref">
  <h2 class="section-title">速查表</h2>
  <p class="section-desc">常用公式、API模式、架构模式快速参考。</p>
  <div class="ref-tabs" id="refTabs"></div>
  <div id="refContents"></div>
</section>

<!-- LEARNING PATHS -->
<section class="section" id="sec-paths">
  <h2 class="section-title">学习路径</h2>
  <p class="section-desc">选择你的职业方向，按照推荐顺序学习。</p>
  <div class="path-selector" id="pathSelector"></div>
  <div id="pathFlows"></div>
</section>

<!-- PROGRESS -->
<section class="section" id="sec-progress">
  <h2 class="section-title">进度追踪</h2>
  <p class="section-desc">勾选已掌握的知识点，进度自动保存到本地。</p>
  <div class="progress-stats" id="progStats"></div>
  <div class="progress-list" id="progList"></div>
</section>

<!-- ANALOGY EXPLANATIONS -->
<section class="section" id="sec-analogy">
  <h2 class="section-title">类比解释</h2>
  <p class="section-desc">用生活中的类比来理解复杂概念，让抽象变具体。</p>
  <div class="analogy-grid" id="analogyGrid"></div>
</section>

<!-- COMPARISON TABLES -->
<section class="section" id="sec-compare">
  <h2 class="section-title">对比表</h2>
  <p class="section-desc">技术选型一目了然，多维度对比帮助决策。</p>
  <div id="compareContent"></div>
</section>

<!-- CONCEPT RELATIONSHIP MAP -->
<section class="section" id="sec-relmap">
  <h2 class="section-title">概念关系图</h2>
  <p class="section-desc">点击概念查看前置知识和关联概念，规划学习路径。</p>
  <div class="rel-legend">
    <span><span class="rel-dot" style="background:var(--accent)"></span>当前选中</span>
    <span><span class="rel-dot" style="background:var(--green)"></span>前置知识</span>
    <span><span class="rel-dot" style="background:var(--cyan)"></span>关联概念</span>
    <span><span class="rel-dot" style="background:rgba(0,0,0,.2)"></span>其他</span>
  </div>
  <div class="rel-container" id="relBox">
    <svg id="relSvg"></svg>
    <div class="rel-info" id="relInfo"></div>
  </div>
</section>

<!-- ONE-LINE SUMMARIES -->
<section class="section" id="sec-oneline">
  <h2 class="section-title">一句话总结</h2>
  <p class="section-desc">每个概念用一句话记住核心要点，快速回顾利器。</p>
  <div class="oneline-grid" id="onelineGrid"></div>
</section>

</div>

// ===== KNOWLEDGE GRAPH =====
(function(){
  const svg = document.getElementById('graphSvg');
  const tooltip = document.getElementById('tooltip');
  const W = 1400, H = 600;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

  const positions = {};
  const cx = W/2, cy = H/2;
  const layers = [
    {ids:['ml','database','docker'],y:80},
    {ids:['dl','nlp'],y:170},
    {ids:['cv','transformer','vectordb'],y:270},
    {ids:['llm-stack','rag','interview'],y:370},
    {ids:['finetune','agent','inference','observability','multimodal','rag-adv'],y:460},
    {ids:['langgraph','safety','serving','project'],y:550},
    {ids:['startup','finance'],y:560},
  ];
  layers.forEach(layer => {
    const n = layer.ids.length;
    layer.ids.forEach((id, i) => {
      const d = DOMAINS.find(d => d.id === id);
      positions[id] = {x: (W/(n+1))*(i+1), y: layer.y, data: d};
    });
  });

  const jitter = {rag:-40,agent:50,finetune:-60,inference:30,multimodal:-20,'rag-adv':60,safety:-30,serving:40,project:-10,startup:-50,finance:50};
  Object.keys(jitter).forEach(k => { if(positions[k]) positions[k].x += jitter[k]; });

  EDGES.forEach(([from, to]) => {
    if(!positions[from] || !positions[to]) return;
    const line = document.createElementNS('http://www.w3.org/2000/svg','path');
    const x1=positions[from].x, y1=positions[from].y, x2=positions[to].x, y2=positions[to].y;
    const mx = (x1+x2)/2, my = (y1+y2)/2 - 30;
    line.setAttribute('d', `M${x1},${y1} Q${mx},${my} ${x2},${y2}`);
    line.setAttribute('class','graph-edge');
    svg.appendChild(line);
  });

  DOMAINS.forEach(d => {
    const p = positions[d.id];
    if(!p) return;
    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('class','graph-node');
    g.setAttribute('transform',`translate(${p.x},${p.y})`);

    const circle = document.createElementNS('http://www.w3.org/2000/svg','circle');
    circle.setAttribute('r', d.num === '+' ? 20 : 26);
    circle.setAttribute('class','node-circle');
    circle.setAttribute('fill', d.color + '18');
    circle.setAttribute('stroke', d.color);
    circle.setAttribute('stroke-width','1.5');
    g.appendChild(circle);

    const text = document.createElementNS('http://www.w3.org/2000/svg','text');
    text.setAttribute('class','node-label');
    text.setAttribute('dy','4');
    text.textContent = d.name.length > 5 ? d.name.slice(0,5)+'…' : d.name;
    g.appendChild(text);

    g.addEventListener('mouseenter', e => {
      tooltip.innerHTML = `<strong>${d.name}</strong><br><span style="color:${d.color}">${d.diff}</span> · ${d.cat}<br><br>${d.desc}`;
      tooltip.classList.add('show');
    });
    g.addEventListener('mousemove', e => {
      const rect = document.getElementById('graphBox').getBoundingClientRect();
      tooltip.style.left = (e.clientX - rect.left + 16) + 'px';
      tooltip.style.top = (e.clientY - rect.top - 10) + 'px';
    });
    g.addEventListener('mouseleave', () => tooltip.classList.remove('show'));

    svg.appendChild(g);
  });
})();

// ===== PROGRESS TRACKER =====
(function(){
  const KEY = 'ai-kb-progress';
  const saved = JSON.parse(localStorage.getItem(KEY) || '{}');
  const stats = document.getElementById('progStats');
  const list = document.getElementById('progList');

  function render(){
    const total = DOMAINS.length;
    const done = DOMAINS.filter(d => saved[d.id]).length;
    const pct = Math.round(done/total*100);
    stats.innerHTML = `
      <div><div class="stat"><div class="stat-val">${done}/${total}</div><div class="stat-label">已完成</div></div></div>
      <div><div class="stat"><div class="stat-val">${pct}%</div><div class="stat-label">完成率</div></div></div>
      <div style="flex:1"><div class="stat"><div class="progress-bar-wrap"><div class="progress-bar" style="width:${pct}%"></div></div><div class="stat-label">总体进度</div></div></div>`;

    list.innerHTML = '';
    DOMAINS.forEach(d => {
      list.innerHTML += `
        <div class="prog-item">
          <div class="prog-check ${saved[d.id]?'checked':''}" data-id="${d.id}"></div>
          <div><div class="prog-name">${d.name}</div><div class="prog-cat">${d.cat} · ${d.diff === 'easy' ? '入门' : d.diff === 'medium' ? '进阶' : '高级'}</div></div>
        </div>`;
    });

    list.querySelectorAll('.prog-check').forEach(el => {
      el.addEventListener('click', () => {
        const id = el.dataset.id;
        if(saved[id]) delete saved[id]; else saved[id] = true;
        localStorage.setItem(KEY, JSON.stringify(saved));
        render();
      });
    });
  }
  render();
})();

    {c:"RAG",a:"开卷考试",e:"LLM是闭卷考生(只靠记忆)，RAG给它配了一本参考书(知识库)。答题前先翻书找相关内容(检索)，再结合自己的理解作答(生成)。书可以随时更新，不用重新培训考生。",icon:"◈"},
    {c:"Agent",a:"项目经理",e:"Agent就像一个项目经理：接到任务后拆解子任务(规划)、分配给合适的工具执行(工具调用)、检查结果是否合格(反思)、不满意就重新做(迭代)。LLM是它的大脑，工具是它的手脚。",icon:"◆"},
    {c:"Fine-tuning",a:"岗前培训",e:"通用LLM是大学毕业生(什么都会一点)，Fine-tuning是岗前培训——用特定领域的教材(训练数据)强化训练，让它成为某个领域的专家。LoRA就像只培训它的'副脑'，成本低见效快。",icon:"◇"},
    {c:"向量数据库",a:"图书馆索引",e:"传统数据库按书名/ISBN查找(关键词匹配)，向量数据库按'内容相似度'查找——你说'关于勇气的故事'，它能找出《老人与海》，即使书名里没有'勇气'二字。Embedding就是给每本书生成一个'内容DNA'。",icon:"▦"},
    {c:"LangGraph",a:"流程图执行器",e:"LangGraph就像一个智能流程图执行器：每个方框(节点)是一个任务，箭头(边)决定下一步去哪。支持条件分支('如果结果不好就重做')、并行('同时做A和B')、循环('反复优化直到满意')。",icon:"⬡"},
    {c:"Embedding",a:"DNA序列",e:"Embedding是文本的'DNA'——把一段文字变成一串数字向量。意思相近的文字，DNA也相似('国王'和'女王'的DNA很接近)。有了DNA就能计算任意两段文字的'亲缘关系'。",icon:"◎"},
    {c:"Attention",a:"聚光灯",e:"读一句话时，你的大脑会自动聚焦重要的词。Attention机制就是给模型装了聚光灯——处理'苹果发布了新手机'时，灯光会聚焦在'苹果'和'手机'上，而不是'了'和'新'。Multi-Head就是多盏灯从不同角度照。",icon:"◉"},
    {c:"LoRA",a:"副驾驶",e:"大模型是一辆卡车(参数巨大)，LoRA是在卡车上加一个小小的'副驾驶方向盘'(低秩矩阵)。只需训练这个小方向盘就能改变卡车的行驶方向，而不用重新造一辆卡车。参数量从百亿降到百万级。",icon:"▸"},
    {c:"Prompt Engineering",a:"下达指令",e:"同一个员工，你给他模糊指令('做个东西')和精确指令('用React做一个登录页，要求邮箱验证+记住密码')，产出天差地别。Prompt Engineering就是学会给AI下达精确指令的技巧。",icon:"✎"},
    {c:"量化",a:"图片压缩",e:"模型量化就像把高清图(32位浮点)压缩成缩略图(4位整数)——文件小了很多，加载快了很多，画质略有损失但大多数场景够用。INT4量化能让7B模型从14GB缩小到4GB，一张消费级显卡就能跑。",icon:"⊞"},
    {c:"RLHF",a:"师傅带徒弟",e:"RLHF训练分三步：1)徒弟先自学(预训练)；2)师傅给徒弟的作业打分(训练奖励模型)；3)徒弟根据师傅的偏好调整写法(强化学习)。就像学写作——先大量阅读，再让编辑给反馈，最后按编辑口味改稿。",icon:"◈"},
    {c:"向量检索",a:"找相似照片",e:"你在手机相册搜'海滩'，它不是靠文件名找的——而是把每张照片编码成向量，计算和'海滩'这个词向量的距离。距离越近越相似。向量检索就是这个原理，只不过用在文本上。",icon:"◎"},
    {c:"ReAct",a:"边想边做",e:"ReAct模式就像一个经验丰富的工人：先想(Thought:这个问题需要查资料)→再做(Action:搜索关键词)→看结果(Observation:找到了3条信息)→继续想(Thought:信息够了，可以回答了)。思考和行动交替进行。",icon:"⟳"},
    {c:"Guardrails",a:"安检门",e:"AI Guardrails就像机场安检：用户输入要过'入口安检'(检测注入攻击/有害内容)，AI输出要过'出口安检'(检测泄露隐私/有害建议)。不合格的直接拦截，合格的放行。可配置不同严格级别。",icon:"⊟"},
    {c:"多模态",a:"五感通才",e:"早期AI只处理文字(只会听)，多模态AI同时理解文字+图片+音频+视频(听+看+读)。就像一个全能翻译，能听懂对话、看懂图表、读懂文档，然后综合所有信息给出答案。GPT-4V就是典型代表。",icon:"⊡"},
  ];
  grid.innerHTML = analogies.map(a => `
    <div class="analogy-card">
      <div class="analogy-header">
        <div class="analogy-icon">${a.icon}</div>
        <div><div class="analogy-concept">${a.c}</div><div class="analogy-title">好比「${a.a}」</div></div>
      </div>
      <div class="analogy-body">
        <div class="analogy-text">${a.e}</div>
      </div>
    </div>
  `).join('');
})();

// ===== CONCEPT RELATIONSHIP MAP =====
(function(){
  const svg = document.getElementById('relSvg');
  const info = document.getElementById('relInfo');
  const W=1200,H=500;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const deps = {
    nlp:{pre:["ml"],rel:["transformer","rag"]},
    transformer:{pre:["nlp"],rel:["llm-stack","attention"]},
    "llm-stack":{pre:["transformer"],rel:["finetune","inference","rlhf"]},
    rag:{pre:["nlp","vectordb"],rel:["rag-adv","agent"]},
    agent:{pre:["llm-stack"],rel:["langgraph","rag"]},
    langgraph:{pre:["agent"],rel:["project"]},
    finetune:{pre:["llm-stack"],rel:["inference","serving"]},
    vectordb:{pre:["dl"],rel:["rag","rag-adv"]},
    inference:{pre:["llm-stack"],rel:["serving","safety"]},
    observability:{pre:["inference"],rel:["serving"]},
    safety:{pre:["llm-stack"],rel:["observability"]},
    serving:{pre:["inference"],rel:["observability"]},
    multimodal:{pre:["transformer","cv"],rel:["llm-stack"]},
    "rag-adv":{pre:["rag","agent"],rel:["langgraph"]},
    cv:{pre:["dl"],rel:["multimodal"]},
    dl:{pre:["ml"],rel:["nlp","cv"]},
    ml:{pre:[],rel:["dl","nlp"]},
    database:{pre:[],rel:["vectordb"]},
    docker:{pre:[],rel:["serving","observability"]},
    interview:{pre:["llm-stack"],rel:["project"]},
    project:{pre:["rag","agent","langgraph"],rel:["startup"]},
    startup:{pre:["project"],rel:["finance"]},
    finance:{pre:["ml"],rel:["startup"]},
  };
  const keys = Object.keys(deps);
  const pos = {};
  keys.forEach((k,i) => {
    const angle = (i/keys.length)*Math.PI*2 - Math.PI/2;
    const r = 200;
    pos[k] = {x: W/2 + r*Math.cos(angle), y: H/2 + r*Math.sin(angle)};
  });
  const drawn = new Set();
  Object.entries(deps).forEach(([k,v])=>{
    [...v.pre,...v.rel].forEach(t=>{
      if(!pos[t]) return;
      const key = [k,t].sort().join('-');
      if(drawn.has(key)) return;
      drawn.add(key);
      const line = document.createElementNS('http://www.w3.org/2000/svg','line');
      line.setAttribute('x1',pos[k].x);line.setAttribute('y1',pos[k].y);
      line.setAttribute('x2',pos[t].x);line.setAttribute('y2',pos[t].y);
      line.setAttribute('class','rel-edge');
      line.dataset.from=k;line.dataset.to=t;
      svg.appendChild(line);
    });
  });
  keys.forEach(k=>{
    const d = DOMAINS.find(dd=>dd.id===k);
    if(!d||!pos[k]) return;
    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('transform',`translate(${pos[k].x},${pos[k].y})`);
    g.setAttribute('class','rel-node');
    g.dataset.id=k;
    const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('r',18);c.setAttribute('fill',d.color+'22');c.setAttribute('stroke',d.color);c.setAttribute('stroke-width','1.5');
    g.appendChild(c);
    const t = document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('class','node-label');t.setAttribute('dy','4');
    t.textContent=d.name.length>4?d.name.slice(0,4)+'…':d.name;
    g.appendChild(t);
    g.addEventListener('click',()=>{
      svg.querySelectorAll('.rel-node circle').forEach(c=>c.setAttribute('fill',c.getAttribute('stroke')+'22'));
      svg.querySelectorAll('.rel-edge').forEach(e=>e.setAttribute('class','rel-edge'));
      const dep=deps[k];
      c.setAttribute('fill',d.color+'66');
      dep.pre.forEach(p=>{
        const pn=svg.querySelector(`.rel-node[data-id="${p}"] circle`);
        if(pn)pn.setAttribute('fill','#2d9d4e66');
      });
      dep.rel.forEach(r=>{
        const rn=svg.querySelector(`.rel-node[data-id="${r}"] circle`);
        if(rn)rn.setAttribute('fill','#0989a666');
      });
      svg.querySelectorAll('.rel-edge').forEach(e=>{
        if(e.dataset.from===k||e.dataset.to===k) e.setAttribute('class','rel-edge active');
      });
      const preNames=dep.pre.map(p=>DOMAINS.find(dd=>dd.id===p)?.name||p);
      const relNames=dep.rel.map(r=>DOMAINS.find(dd=>dd.id===r)?.name||r);
      info.style.display='block';
      info.innerHTML=`<div style="margin-bottom:8px"><strong>${d.name}</strong></div>
        <div style="margin-bottom:4px"><span style="color:var(--green)">● 前置知识：</span>${preNames.join('、')||'无'}</div>
        <div><span style="color:var(--cyan)">● 关联概念：</span>${relNames.join('、')||'无'}</div>`;
    });
    svg.appendChild(g);
  });
})();
