# Prometheus Configuration for AI创作工坊
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: "ai-workshop"
    environment: "production"

rule_files:
  - "alerting.yml"

scrape_configs:
  - job_name: "ai-workshop-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: "api"

  - job_name: "redis"
    static_configs:
      - targets: ["redis:6379"]

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres:5432"]

  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]
